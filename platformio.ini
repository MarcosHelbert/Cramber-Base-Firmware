; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
board = genericSTM32F405RG
framework = libopencm3

upload_protocol = stlink
debug_tool = stlink

lib_ldf_mode = chain+

board_build.ldscript = app.ld
extra_scripts = scripts/full_firmware.py

build_flags =
    ; C++ Lang
    -std=c++17
    -O3
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -fno-use-cxa-atexit

    ; Math Otimizations
    -D ARM_MATH_CM4
    -D __FPU_PRESENT=1
    -ffast-math
    -fno-math-errno
    -funsafe-math-optimizations
    -ffinite-math-only
    -ftree-vectorize
    -funroll-loops

    ; Hardware specific config (Cortex-M4F)
    -march=armv7e-m
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -D STM32F4

    -D USE_FREERTOS

    -I include
    -I shared
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable

build_unflags =
    -Os
    -fno-rtti

lib_deps =
    https://github.com/hathach/tinyusb


[env:genericSTM32F405RG_release]
build_type = release


[env:genericSTM32F405RG_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -D DEBUG
debug_build_flags =
    -O0
    -g3
    -ggdb