[env:bootloader]
platform = ststm32
board = genericSTM32F405RG
framework = libopencm3

upload_protocol = stlink
debug_tool = stlink

board_build.ldscript = bootloader.ld

build_flags =
    -std=c++17
    -Os
    -fno-exceptions
    -fno-rtti
    -march=armv7e-m
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -D STM32F4
    -I include
    -I ../shared

build_unflags =
    -fno-rtti

lib_deps =
    https://github.com/hathach/tinyusb
